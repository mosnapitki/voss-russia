<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071522">
  <title>VOSS — AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#071522;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
    .wrap{min-height:100vh;display:flex;flex-direction:column}
    header{padding:24px 22px 10px;text-align:center}
    .logo{font-size:42px;letter-spacing:.28em;font-weight:300;margin-left:.28em}
    .sub{font-size:11px;letter-spacing:.28em;opacity:.8;margin-top:7px}
    .hint{font-size:16px;line-height:1.4;opacity:.9;margin:20px auto 0;max-width:420px}
    model-viewer{width:100%;height:58vh;min-height:390px;background:radial-gradient(circle at 50% 45%,#243c4d 0,#0b1c29 48%,#071522 100%)}
    .controls{padding:16px 20px 30px;display:flex;flex-direction:column;gap:10px;align-items:center}
    button{border:0;border-radius:999px;padding:15px 28px;font-size:16px;font-weight:700;cursor:pointer}
    #ar-button{background:#fff;color:#071522}
    .note{font-size:12px;opacity:.65;text-align:center;line-height:1.45;max-width:430px}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">VOSS</div>
    <div class="sub">NORWEGIAN PREMIUM WATER</div>
    <div class="hint">Поставьте бутылку VOSS прямо перед собой — в дополненной реальности.</div>
  </header>

  <model-viewer
    id="voss"
    src="./voss-bottle.glb"
    alt="3D бутылка VOSS"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral">
    <button slot="ar-button" id="ar-button">✦ Запустить AR</button>
  </model-viewer>

  <div class="controls">
    <div class="note">
      Разрешите доступ к камере. Наведите телефон на пол или стол и разместите бутылку VOSS.
      На iPhone откроется режим дополненной реальности через Safari.
    </div>
  </div>
</div>
</body>
</html>
